spring:
  application:
    name: autoandes-backend
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
app:
  jwt:
    expiration-seconds: 3600
springdoc:
  swagger-ui:
    path: /swagger-ui.html
