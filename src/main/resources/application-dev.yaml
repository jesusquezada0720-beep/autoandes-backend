server:
  port: ${AUTOANDES_PORT:8080}
spring:
  datasource:
    url: ${AUTOANDES_DB_URL:jdbc:oracle:thin:@//localhost:1522/FREEPDB1}
    username: ${AUTOANDES_DB_USERNAME:AUTOANDES}
    password: ${AUTOANDES_DB_PASSWORD:autoandes}
