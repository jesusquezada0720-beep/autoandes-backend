server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: ${AUTOANDES_DB_URL}
    username: ${AUTOANDES_DB_USERNAME}
    password: ${AUTOANDES_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    schemas: ${AUTOANDES_DB_SCHEMA}
    default-schema: ${AUTOANDES_DB_SCHEMA}
    create-schemas: false
app:
  jwt:
    secret: ${AUTOANDES_JWT_SECRET}
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
